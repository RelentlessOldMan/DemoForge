[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "demoforge"
version = "1.0.0"
description = "Capture what a Claude agent actually did, freeze it, and deterministically render records/slides/video — never re-running the agent, never fabricating an action."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RelentlessOldMan" }]
dependencies = [
  "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "coverage==7.16.2", "openpyxl==3.1.5"]
# The replay/video layer. Records and slides never need these; the frame
# renderer imports them lazily so a machine without them still builds.
# Chromium itself: `python -m playwright install chromium`.
video = ["Jinja2==3.1.3", "playwright==1.61.0"]

[project.scripts]
demoforge = "demoforge.cli:main"

[tool.setuptools.packages.find]
include = ["demoforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["demoforge"]

[tool.coverage.report]
show_missing = true
